<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherri AI - Portal</title>
  <style>
    :root {
      --primary: #ffb7c5;
      --primary-dark: #e8889c;
      --accent: #ff6f91;
      --bg-start: #fff5f7;
      --bg-end: #ffe4e9;
      --text: #4a2e35;
      --glass: rgba(255, 255, 255, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    #petals-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
    }

    .card {
      position: relative; z-index: 2;
      background: var(--glass); backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 183, 197, 0.4);
      border-radius: 24px; padding: 40px 32px;
      width: 100%; max-width: 420px;
      box-shadow: 0 16px 40px rgba(232, 136, 156, 0.2);
      text-align: center;
    }

    .logo { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .subtitle { font-size: 0.95rem; color: #7a525d; margin-bottom: 28px; line-height: 1.4; }

    .input-group { margin-bottom: 20px; text-align: left; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text); display: block; margin-bottom: 6px; }

    input[type="email"], input[type="password"] {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1.5px solid var(--primary); outline: none; font-size: 1rem;
      background: rgba(255, 255, 255, 0.9); transition: all 0.3s ease;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 111, 145, 0.2); }

    .otp-container { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 24px; }
    .otp-input {
      width: 48px; height: 56px; text-align: center; font-size: 1.4rem;
      font-weight: 700; border-radius: 12px; border: 1.5px solid var(--primary);
      background: rgba(255, 255, 255, 0.9); outline: none;
    }

    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 111, 145, 0.3); transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.95; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .step { display: none; }
    .step.active { display: block; }
    .status-msg { margin-top: 14px; font-size: 0.85rem; }
    .status-msg.error { color: #d93856; }
    .status-msg.success { color: #2e7d32; }
  </style>
</head>
<body>

  <canvas id="petals-canvas"></canvas>

  <div class="card">
    <div class="logo">🌸 Cherri AI</div>

    <!-- STEP 1: Enter Email -->
    <div id="step-1" class="step active">
      <p class="subtitle">Enter your email to sign in or register.</p>
      <form id="email-form">
        <div class="input-group">
          <label for="user-email">Email Address</label>
          <input type="email" id="user-email" placeholder="name@example.com" required>
        </div>
        <button type="submit" id="email-btn" class="btn">Continue</button>
      </form>
    </div>

    <!-- STEP 2A: Password Login (Recognized Email) -->
    <div id="step-login" class="step">
      <p class="subtitle">Welcome back! Enter your password for <b id="login-email-display"></b>.</p>
      <form id="login-form">
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- STEP 2B: OTP Verification (Unrecognized Email) -->
    <div id="step-otp" class="step">
      <p class="subtitle">New email detected. Enter the 6-digit code sent to <b id="otp-email-display"></b>.</p>
      <div class="otp-container">
        <input type="text" maxlength="1" class="otp-input" />
        <input type="text" maxlength="1" class="otp-input" />
        <input type="text" maxlength="1" class="otp-input" />
        <input type="text" maxlength="1" class="otp-input" />
        <input type="text" maxlength="1" class="otp-input" />
        <input type="text" maxlength="1" class="otp-input" />
      </div>
      <button id="verify-otp-btn" class="btn">Verify Code</button>
    </div>

    <!-- STEP 2C: Create Password (After OTP Success) -->
    <div id="step-create-pass" class="step">
      <p class="subtitle">Email verified! Create a password for future logins.</p>
      <form id="create-pass-form">
        <div class="input-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="Create a secure password" required>
        </div>
        <button type="submit" class="btn">Save & Continue</button>
      </form>
    </div>

    <!-- STEP 3: Redirecting -->
    <div id="step-success" class="step">
      <p class="subtitle">✨ Success!</p>
      <h3 style="color: var(--accent);">Redirecting to Cherri AI...</h3>
    </div>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby847tdUpmP12Twj7rWO6-KIHZ7uXmakTs1UFPi_h5O-vVEUzKy9FoN5kUynxLvkBJ4/exec";
      const REDIRECT_URL = "https://cdn.jsdelivr.net/gh/cherriunblocked/svg@main/index.svg";

      let currentEmail = "";
      let generatedOTP = "";

      // Step 1: Check Email in Database
      document.getElementById('email-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        e.stopPropagation();

        currentEmail = document.getElementById('user-email').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('email-btn');

        if (!currentEmail) return false;

        btn.disabled = true;
        status.className = "status-msg";
        status.innerText = "Checking database...";

        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "check", email: currentEmail })
          });
          const result = await response.json();

          status.innerText = "";
          btn.disabled = false;

          if (result.exists) {
            // Recognized -> Go to Password Login
            document.getElementById('login-email-display').innerText = currentEmail;
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-login').classList.add('active');
          } else {
            // Unrecognized -> Send OTP & go to OTP Verification
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            status.innerText = "Sending verification code...";
            
            await fetch(WEB_APP_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: "send_otp", email: currentEmail, code: generatedOTP })
            });

            status.innerText = "";
            document.getElementById('otp-email-display').innerText = currentEmail;
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-otp').classList.add('active');
            document.querySelectorAll('.otp-input')[0].focus();
          }
        } catch (err) {
          console.error(err);
          status.className = "status-msg error";
          status.innerText = "Connection error. Try again.";
          btn.disabled = false;
        }

        return false;
      });

      // Step 2A: Login Form Handler
      document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        e.stopPropagation();

        const password = document.getElementById('login-password').value;
        const status = document.getElementById('status');

        status.className = "status-msg";
        status.innerText = "Authenticating...";

        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "login", email: currentEmail, password: password })
          });
          const result = await response.json();

          if (result.status === "success") {
            status.className = "status-msg success";
            status.innerText = "Logged in! Redirecting...";
            document.getElementById('step-login').classList.remove('active');
            document.getElementById('step-success').classList.add('active');
            setTimeout(() => { window.location.href = REDIRECT_URL; }, 800);
          } else {
            status.className = "status-msg error";
            status.innerText = "Incorrect password.";
          }
        } catch (err) {
          status.className = "status-msg error";
          status.innerText = "Login failed.";
        }

        return false;
      });

      // Step 2B: OTP Input & Verification Logic
      const otpInputs = document.querySelectorAll('.otp-input');
      otpInputs.forEach((input, idx) => {
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = e.clipboardData.getData('text').replace(/\D/g, '');
          for (let i = 0; i < Math.min(pasteData.length, otpInputs.length); i++) {
            otpInputs[i].value = pasteData[i];
          }
          const lastIdx = Math.min(pasteData.length - 1, otpInputs.length - 1);
          otpInputs[lastIdx].focus();
          checkOTPComplete();
        });

        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val;
          if (val && idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
          checkOTPComplete();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && idx > 0) otpInputs[idx - 1].focus();
        });
      });

      function checkOTPComplete() {
        let code = "";
        otpInputs.forEach(i => code += i.value);
        if (code.length === 6) verifyOTPCode(code);
      }

      function verifyOTPCode(code) {
        const status = document.getElementById('status');
        if (code === generatedOTP) {
          status.className = "status-msg success";
          status.innerText = "Code verified! Create your password.";
          document.getElementById('step-otp').classList.remove('active');
          document.getElementById('step-create-pass').classList.add('active');
        } else {
          status.className = "status-msg error";
          status.innerText = "Incorrect code.";
          otpInputs.forEach(i => i.value = "");
          otpInputs[0].focus();
        }
      }

      document.getElementById('verify-otp-btn').addEventListener('click', (e) => {
        e.preventDefault();
        let code = "";
        otpInputs.forEach(i => code += i.value);
        verifyOTPCode(code);
      });

      // Step 2C: Create Password & Save to Database
      document.getElementById('create-pass-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        e.stopPropagation();

        const newPassword = document.getElementById('new-password').value;
        const status = document.getElementById('status');

        status.className = "status-msg";
        status.innerText = "Saving account...";

        try {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "register", email: currentEmail, password: newPassword })
          });

          status.className = "status-msg success";
          status.innerText = "Account created! Redirecting...";
          document.getElementById('step-create-pass').classList.remove('active');
          document.getElementById('step-success').classList.add('active');
          setTimeout(() => { window.location.href = REDIRECT_URL; }, 800);
        } catch (err) {
          status.className = "status-msg error";
          status.innerText = "Error saving account.";
        }

        return false;
      });

      // Petals Animation
      const canvas = document.getElementById('petals-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const petals = Array.from({ length: 30 }, () => ({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        size: Math.random() * 8 + 6, speedY: Math.random() * 1.5 + 0.5,
        speedX: Math.random() * 1 - 0.5, angle: Math.random() * 360
      }));
      function animatePetals() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        petals.forEach(p => {
          p.y += p.speedY; p.x += p.speedX; p.angle += 0.02;
          if (p.y > canvas.height) p.y = -10;
          if (p.x > canvas.width) p.x = 0; if (p.x < 0) p.x = canvas.width;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
          ctx.fillStyle = '#ffb7c5'; ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.restore();
        });
        requestAnimationFrame(animatePetals);
      }
      animatePetals();
    });
  </script>
</body>
</html>
